server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime config is generated at container start; never cache it.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    # Hashed build assets are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Keep browser API requests on the frontend origin. Both containers share
    # shared-proxy; resolve at request time so startup does not depend on the
    # backend already being available.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream jobtracker-app:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }

    # SPA fallback for client-side routes (/profiles, /jobs/:id, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
