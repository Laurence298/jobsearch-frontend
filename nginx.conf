server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime config is generated at container start; never cache it.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    # Hashed build assets are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for client-side routes (/profiles, /jobs/:id, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
