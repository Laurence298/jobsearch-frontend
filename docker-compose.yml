services:
  web:
    build:
      context: .
      args:
        # Optional build-time default; Docker uses the runtime /api path below.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: jobtracker-web
    pull_policy: build
    container_name: jobtracker-web
    environment:
      # Browser-visible URL, not a Docker hostname. /api stays on the frontend
      # origin; nginx.conf forwards it to jobtracker-app over shared-proxy.
      API_BASE_URL: ${API_BASE_URL:-/api}
    networks:
      # Join the reverse-proxy network so the proxy can reach jobtracker-web:80.
      - shared-proxy
    ports:
      - "8086:80"
    restart: unless-stopped

networks:
  shared-proxy:
    external: true
